# Render Blueprint for OPEN SIGNAL AI — one web service serves the API,
# the Admin panel (/admin/) and the Telegram Mini App (/app/).
# Render → New → Blueprint → select this repository → Apply.
services:
  - type: web
    name: open-signal-ai
    runtime: node
    plan: free            # free instances sleep after 15 min idle; switch to a paid instance for always-on
    region: frankfurt
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: LOG_LEVEL
        value: info
      # Generated once by Render and kept across deploys. Back up ENCRYPTION_KEY:
      # without it, stored bot tokens cannot be decrypted.
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_SETUP_TOKEN
        generateValue: true
      # The only value you paste: the Firebase service-account key (whole JSON).
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
